apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
spec:
  # Escalabilidade horizontal: 3 replicas atras do mesmo Service.
  replicas: 3
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      containers:
        - name: book-service
          image: bookgather/book-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql-bookgather
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: bookdb
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: mysql-book-auth, key: password}
          readinessProbe:
            httpGet: {path: /instance, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 640Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: book-service
spec:
  selector:
    app: book-service
  ports:
    - port: 8080
      targetPort: 8080
