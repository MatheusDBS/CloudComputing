# Banco exclusivo do book-service (Database per Service).
apiVersion: v1
kind: Secret
metadata:
  name: mysql-book-auth
type: Opaque
stringData:
  password: labbook123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-bookgather
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-bookgather
  template:
    metadata:
      labels:
        app: mysql-bookgather
    spec:
      containers:
        - name: mysql-bookgather
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: bookdb
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: mysql-book-auth, key: password}
          readinessProbe:
            tcpSocket: {port: 3306}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      # emptyDir: o EKS do Learner Lab nao tem o driver EBS CSI instalado,
      # entao um PersistentVolumeClaim ficaria Pending. Os dados vivem enquanto o Pod viver.
      volumes:
        - name: mysql-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-bookgather
spec:
  selector:
    app: mysql-bookgather
  ports:
    - port: 3306
      targetPort: 3306
