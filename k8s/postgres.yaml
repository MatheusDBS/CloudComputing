# Banco exclusivo do review-service (Database per Service).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-review-auth
type: Opaque
stringData:
  username: review
  password: labreview123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-review
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-review
  template:
    metadata:
      labels:
        app: postgres-review
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: reviewdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-review-auth, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-review-auth, key: password}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "review", "-d", "reviewdb"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-review
spec:
  selector:
    app: postgres-review
  ports:
    - port: 5432
      targetPort: 5432
