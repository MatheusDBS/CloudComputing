apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookgather-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /books
            pathType: Prefix
            backend:
              service:
                name: book-service
                port: {number: 8080}
          - path: /instance
            pathType: Prefix
            backend:
              service:
                name: book-service
                port: {number: 8080}
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: book-service
                port: {number: 8080}
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: book-service
                port: {number: 8080}
          - path: /reviews
            pathType: Prefix
            backend:
              service:
                name: review-service
                port: {number: 3000}
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port: {number: 5000}
