# ClusterConfig do eksctl (nao e um manifesto Kubernetes).
# Substitua os ARNs pelos do SEU Learner Lab:
#   aws iam list-roles --query "Roles[?contains(RoleName, 'LabEks')].[RoleName,Arn]" --output table
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: bookgather
  region: us-east-1

iam:
  serviceRoleARN: "arn:aws:iam::568385838582:role/c222296a5607975l18243012t1w568385-LabEksClusterRole-erQphQwiWu6l"

managedNodeGroups:
  - name: bookgather-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    iam:
      instanceRoleARN: "arn:aws:iam::568385838582:role/c222296a5607975l18243012t1w568385838-LabEksNodeRole-WH5wV8pp9pLa"
